<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SiteAgent Preview</title>
  <style>
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f4f4f8; color:#1b1d29; }
    main { max-width:640px; margin:0 auto; padding:64px 16px; text-align:center; }
    p { color:#5d6275; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Assistant preview</h1>
    <p>This is how the assistant will look on your website. Open the chat bubble in the bottom-right corner.</p>
    <p><a href="setup.html">← Back to setup</a></p>
  </main>
  <script src="config.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const s = document.createElement('script');
    s.type = 'module';
    s.src = 'widget.js';
    s.dataset.business = q.get('id') || 'pixelcraft';
    s.dataset.name = q.get('name') || 'Preview';
    document.getElementById('title').textContent = (q.get('name') || 'Assistant') + ' — preview';
    document.body.appendChild(s);
  </script>
</body>
</html>
